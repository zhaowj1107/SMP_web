<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMP 叫牌导航</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#e9edef;        /* 主体背景：冷灰 */
    --rail:#dde5e1;      /* 左侧栏：灰绿 */
    --rail-line:#c7d2cc;
    --panel:#ffffff;     /* 可点击卡片 */
    --leaf:#f4f6f7;      /* 末端条目 */
    --ink:#15181b; --mute:#5c636b; --faint:#889097;
    --line:#d3d9dd;
    --felt:#1d5540; --felt-ink:#ffffff;
    --accent:#1d5540;
    --sel-bg:#1d5540; --sel-ink:#ffffff; --sel-red:#ffc2bb;
    --note:#fbf6e4; --note-line:#c9a227;
    --hover:#f1f7f4;
    --shadow:0 1px 2px rgba(16,28,22,.07), 0 3px 10px rgba(16,28,22,.06);
    --red:#b3261e; --mark:#f5e7a8;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1214; --rail:#161c1f; --rail-line:#262e33;
      --panel:#20282c; --leaf:#181e21;
      --ink:#e6e8ea; --mute:#9ba3aa; --faint:#6b737a; --line:#2d363b;
      --felt:#153628; --felt-ink:#e8ece9; --accent:#7cc3a3;
      --sel-bg:#2e7657; --sel-ink:#ffffff; --sel-red:#ffc2bb;
      --note:#25231a; --note-line:#8d7631; --hover:#27323a;
      --shadow:0 1px 2px rgba(0,0,0,.45), 0 3px 10px rgba(0,0,0,.25);
      --red:#ff8a80; --mark:#4a4020;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1214; --rail:#161c1f; --rail-line:#262e33;
    --panel:#20282c; --leaf:#181e21;
    --ink:#e6e8ea; --mute:#9ba3aa; --faint:#6b737a; --line:#2d363b;
    --felt:#153628; --felt-ink:#e8ece9; --accent:#7cc3a3;
    --sel-bg:#2e7657; --sel-ink:#ffffff; --sel-red:#ffc2bb;
    --note:#25231a; --note-line:#8d7631; --hover:#27323a;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 3px 10px rgba(0,0,0,.25);
    --red:#ff8a80; --mark:#4a4020;
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
  body{
    height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    font-size:15px; line-height:1.5;
    display:flex; flex-direction:column;
  }
  button{ font:inherit; color:inherit; }
  .r{ color:var(--red); }
  mark{ background:var(--mark); color:inherit; padding:0 2px; border-radius:2px; }
  b{ font-weight:700; }

  /* ── 顶栏 ── */
  .top{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:9px 14px; background:var(--felt); color:var(--felt-ink);
    box-shadow:0 1px 0 rgba(0,0,0,.12);
  }
  .home{
    flex:0 0 auto; border:0; background:rgba(255,255,255,.14); color:inherit;
    padding:5px 11px; border-radius:7px; cursor:pointer; font-size:13.5px; white-space:nowrap;
  }
  .home:hover{ background:rgba(255,255,255,.24); }
  .crumbs{ flex:1 1 auto; min-width:0; display:flex; gap:4px; align-items:center; overflow-x:auto; scrollbar-width:none; }
  .crumbs::-webkit-scrollbar{ display:none; }
  .crumbs button{
    border:0; background:none; color:inherit; cursor:pointer; padding:3px 5px; border-radius:5px;
    white-space:nowrap; font-size:14px; font-weight:600;
  }
  .crumbs button:hover{ background:rgba(255,255,255,.16); }
  .crumbs .sep{ opacity:.55; font-size:12px; }
  .crumbs .r{ color:#ffb3ab; }
  .hint{ flex:0 0 auto; font-size:11.5px; opacity:.7; }
  .eye{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    border:1px solid rgba(255,255,255,.28); background:transparent; color:inherit;
    padding:4px 9px 4px 7px; border-radius:999px; cursor:pointer; font-size:12.5px; white-space:nowrap;
  }
  .eye:hover{ background:rgba(255,255,255,.14); }
  .eye svg{ width:17px; height:17px; }
  .eye .off{ display:none; }
  body.desc-off .eye .on{ display:none; }
  body.desc-off .eye .off{ display:inline; }
  body.desc-off .eye{ opacity:.8; }
  body.depth0 .eye{ opacity:.45; }

  /* ── 主体布局 ── */
  .layout{ flex:1 1 auto; min-height:0; display:flex; }
  .rails{ flex:0 0 auto; display:flex; min-height:0; }
  .rail{
    width:160px; flex:0 0 auto; overflow-y:auto;
    background:var(--rail); border-right:1px solid var(--rail-line);
    padding:6px 0 18px;
  }
  .rail.enter{ animation:railIn .18s ease-out; }
  @keyframes railIn{ from{ opacity:0; transform:translateX(-8px);} to{ opacity:1; transform:none;} }
  .rail.narrow{ width:78px; }
  .rail.narrow .m{ display:none; }
  body.desc-off .rail{ width:86px; }
  body.desc-off .rail .m{ display:none; }
  .rh{
    font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--mute);
    padding:7px 12px 6px; position:sticky; top:-6px; background:var(--rail); z-index:1;
  }
  .rg{ font-size:10.5px; color:var(--faint); padding:10px 12px 3px; letter-spacing:.06em; }
  .ri{
    display:block; width:calc(100% - 12px); margin:1px 6px; text-align:left; border:0; background:none; cursor:pointer;
    padding:6px 8px; border-radius:7px;
  }
  .ri:hover:not(:disabled){ background:rgba(255,255,255,.55); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .ri:hover:not(:disabled){ background:rgba(255,255,255,.06);} }
  .ri .b{ display:block; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ri .m{ display:block; font-size:11.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ri.sel{ background:var(--sel-bg); color:var(--sel-ink); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .ri.sel:hover{ background:var(--sel-bg); }
  .ri.sel .m{ color:rgba(255,255,255,.8); }
  .ri.sel .r{ color:var(--sel-red); }
  .ri.leaf{ cursor:default; opacity:.5; }

  main{ flex:1 1 auto; min-width:0; overflow-y:auto; padding:22px 28px 60px; background:var(--bg); }
  .fade{ animation:fade .2s ease-out; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }

  .where{ font-size:12.5px; color:var(--mute); margin:0 0 2px; }
  h1{ font-size:26px; margin:0; line-height:1.2; letter-spacing:.01em; }
  .lead{ font-size:15.5px; margin:6px 0 0; }
  .note{
    margin:14px 0 0; padding:11px 14px; background:var(--note); border:1px solid var(--line);
    border-left:4px solid var(--note-line); border-radius:8px; font-size:14px; max-width:880px;
  }
  .sect{
    display:flex; align-items:baseline; gap:10px; margin:26px 0 9px;
    font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--mute);
  }
  .sect span{ font-weight:400; color:var(--faint); letter-spacing:0; }

  .list{ display:flex; flex-direction:column; gap:7px; max-width:880px; }
  .row{
    display:grid; grid-template-columns:minmax(92px,auto) 1fr auto; gap:14px; align-items:start;
    width:100%; text-align:left; border-radius:9px; padding:11px 14px;
    background:var(--leaf); border:1px solid var(--line);
  }
  button.row{
    cursor:pointer; background:var(--panel); border-color:transparent;
    border-left:4px solid var(--accent); padding-left:11px; box-shadow:var(--shadow);
    transition:transform .08s ease, box-shadow .12s ease;
  }
  button.row:hover{ background:var(--hover); transform:translateY(-1px); }
  button.row:focus-visible,.ri:focus-visible,.card:focus-visible,.eye:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .rb{ font-weight:700; font-size:15.5px; white-space:nowrap; }
  .rm .m{ font-size:14.5px; }
  .rm .d{ font-size:13px; color:var(--mute); margin-top:4px; }
  .chev{ font-size:12px; color:var(--faint); white-space:nowrap; padding-top:2px; }
  button.row .chev{ color:var(--accent); font-weight:600; }

  /* 开叫一览 */
  .intro{ color:var(--mute); font-size:13.5px; margin:6px 0 0; max-width:720px; }
  .grp{ font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--mute); margin:26px 0 10px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; max-width:1100px; }
  .card{
    text-align:left; border-radius:12px; padding:14px 15px; display:flex; flex-direction:column; gap:4px; min-height:112px;
    background:var(--leaf); border:1px solid var(--line);
  }
  button.card{
    cursor:pointer; background:var(--panel); border-color:transparent; border-top:4px solid var(--accent);
    box-shadow:var(--shadow); transition:transform .08s ease;
  }
  button.card:hover{ background:var(--hover); transform:translateY(-1px); }
  .card .b{ font-size:22px; font-weight:700; line-height:1.2; }
  .card .m{ font-size:13.5px; }
  .card .c{ margin-top:auto; font-size:12px; color:var(--accent); font-weight:600; }
  .card.leafcard .c{ color:var(--mute); font-weight:400; }

  /* ── 手机竖屏：左侧栏改为顶部逐行堆叠 ── */
  @media (max-width:760px){
    .hint{ display:none; }
    .eye .t{ display:none; }
    .layout{ flex-direction:column; overflow-y:auto; }
    .rails{ flex-direction:column; }
    .rail, .rail.narrow, body.desc-off .rail{
      width:auto; display:flex; align-items:stretch; gap:6px; overflow-x:auto; overflow-y:hidden;
      border-right:0; border-bottom:1px solid var(--rail-line); padding:7px 10px; scrollbar-width:none;
    }
    .rail::-webkit-scrollbar{ display:none; }
    .rail .m, .rail.narrow .m{ display:block; max-width:150px; font-size:10.5px; }
    body.desc-off .rail .m{ display:none; }
    .rh{ position:static; flex:0 0 auto; align-self:center; padding:0 4px 0 0; font-size:10.5px; background:none; }
    .rg{ display:none; }
    .ri{
      flex:0 0 auto; width:auto; margin:0; border:1px solid var(--rail-line); background:var(--panel);
      border-radius:10px; padding:4px 11px;
    }
    .ri .b{ font-size:13.5px; }
    main{ overflow:visible; padding:16px 14px 50px; }
    h1{ font-size:22px; }
    .row{ grid-template-columns:1fr auto; gap:4px 10px; }
    .rb{ grid-column:1; }
    .chev{ grid-column:2; grid-row:1; }
    .rm{ grid-column:1 / -1; }
    .grid{ grid-template-columns:1fr 1fr; gap:9px; }
    .card{ min-height:98px; padding:12px; }
    .card .b{ font-size:19px; }
  }

  /* ── 状态标签 ── */
  .tag{
    display:inline-block; font-size:11px; font-weight:700; line-height:1.55; letter-spacing:.02em;
    padding:0 7px; border-radius:999px; margin:0 5px 0 0; vertical-align:1px; white-space:nowrap;
  }
  .t-so  { background:#e4e8ec; color:#46515c; }
  .t-nf  { background:#dfebf7; color:#2c5b8a; }
  .t-inv { background:#fdeec0; color:#865600; }
  .t-f   { background:#fde0cb; color:#a0460c; }
  .t-gf  { background:#fad9df; color:#a3193d; }
  .t-slam{ background:#e9e0fa; color:#5731a3; }
  .dots{ display:inline-flex; gap:3px; margin-left:6px; vertical-align:2px; }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .dot.t-so{ background:#7d8893; } .dot.t-nf{ background:#3f78b3; } .dot.t-inv{ background:#d49a14; }
  .dot.t-f{ background:#dd6a24; } .dot.t-gf{ background:#c42a4f; } .dot.t-slam{ background:#7a4fd0; }
  .ri.sel .dot{ box-shadow:0 0 0 1.5px rgba(255,255,255,.85); }
  .card .m .tag{ vertical-align:1px; }
  .lead .tag{ font-size:12px; padding:1px 9px; vertical-align:2px; }
  .legend{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 0; margin:14px 0 0; }
  .legend.foot{ margin-top:34px; padding-top:12px; border-top:1px dashed var(--line); max-width:880px; opacity:.85; }
  .lg-note{ font-size:11.5px; color:var(--faint); margin-left:4px; }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .t-so  { background:rgba(160,172,184,.16); color:#c3cad1; }
    :root:not([data-theme="light"]) .t-nf  { background:rgba(90,150,215,.2);  color:#9fc8f2; }
    :root:not([data-theme="light"]) .t-inv { background:rgba(230,180,60,.18); color:#f0cd72; }
    :root:not([data-theme="light"]) .t-f   { background:rgba(240,130,60,.2);  color:#f5ab7c; }
    :root:not([data-theme="light"]) .t-gf  { background:rgba(240,90,120,.22); color:#f59ab0; }
    :root:not([data-theme="light"]) .t-slam{ background:rgba(160,120,240,.22); color:#c7b0f7; }
    :root:not([data-theme="light"]) .dot.t-so{ background:#9aa5b0; } :root:not([data-theme="light"]) .dot.t-nf{ background:#6fa6e0; }
    :root:not([data-theme="light"]) .dot.t-inv{ background:#e8b93e; } :root:not([data-theme="light"]) .dot.t-f{ background:#f08a4d; }
    :root:not([data-theme="light"]) .dot.t-gf{ background:#ee6b8b; } :root:not([data-theme="light"]) .dot.t-slam{ background:#a785ee; }
  }
  :root[data-theme="dark"] .t-so  { background:rgba(160,172,184,.16); color:#c3cad1; }
  :root[data-theme="dark"] .t-nf  { background:rgba(90,150,215,.2);  color:#9fc8f2; }
  :root[data-theme="dark"] .t-inv { background:rgba(230,180,60,.18); color:#f0cd72; }
  :root[data-theme="dark"] .t-f   { background:rgba(240,130,60,.2);  color:#f5ab7c; }
  :root[data-theme="dark"] .t-gf  { background:rgba(240,90,120,.22); color:#f59ab0; }
  :root[data-theme="dark"] .t-slam{ background:rgba(160,120,240,.22); color:#c7b0f7; }
</style>
</head>
<body>
<header class="top">
  <button class="home" id="home" type="button">开叫一览</button>
  <nav class="crumbs" id="crumbs" aria-label="当前叫序"></nav>
  <span class="hint">Esc 返回上一级</span>
  <button class="eye" id="eye" type="button" aria-pressed="true" title="左侧栏是否显示含义">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1"/><path d="M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
    <span class="t">侧栏含义</span>
  </button>
</header>
<div class="layout" id="layout">
  <div class="rails" id="rails"></div>
  <main id="main"></main>
</div>

<script>
/* ───────────────────────── 叫牌树 ─────────────────────────
   N(叫品, 含义, {d:补充说明, c:[子节点], next:子节点栏标题})
   说明文字支持：**加粗**  ==标黄==  \n 换行                    */
function N(b, m, o){ o = o || {}; return { b:b, m:m || '', d:o.d || '', c:o.c || [], next:o.next || '', g:o.g || '', t:o.t || null }; }

var LABELS = ['开叫','应叫','开叫人再叫','应叫人再叫','开叫人第三次叫','应叫人第三次叫','后续','后续','后续'];

var ROOTS = [

/* ============================== 1♣ ============================== */
N('1♣','16+（平均 17+），任意牌型，人为',{g:'开叫', t:['f'], d:'口诀：**对面随机 8 点就想打局**', c:[

  N('1♢','0–7，任意牌型',{c:[
    N('1NT','17–19 平均',{d:'同 1NT 开叫，应叫人按常规后续处理'}),
    N('2NT','22–24 平均',{d:'同 2NT 开叫'}),
    N('3NT','25–27 平均',{d:'==Kokish？待确认=='}),
    N('1♡ / 1♠','17–22−，5 张或 4 张，逼叫一轮',{d:'应叫人**不能 pass**。\n个人想法：有 4 张高花且能叫 1NT（如 4432）时优先 1NT；此时 4 张高花通常意味着另有低花长套，特例 4414', c:[
      N('1♠','（1♡ 再开后）0–7，4 张↑，逼叫',{c:[
        N('1NT','1444，非逼叫'),
        N('2♣ / 2♢','5-4 两套，非逼叫'),
        N('再叫原花色','6 张，非逼叫'),
        N('2♠','加叫：3 张 16–19，或 4 张 16–17'),
        N('3♠','跳加叫：3 张 20–21，或 4 张 18–19'),
        N('2NT','21–22，非逼叫'),
        N('3♣ / 3♢','4 张高花 + 5 张低花，逼局'),
        N('跳原花色','定将牌，邀请'),
        N('3NT / 4M','想打，无满贯兴趣'),
        N('跳新花','splinter，4 张支持，20+')
      ]}),
      N('1NT','0–5，否认 4 张高花，不逼叫',{c:[
        N('Pass','—'),
        N('2♣ / 2♢','5-4 两套，非逼叫'),
        N('再叫原花色','6 张，非逼叫'),
        N('2♡','（1♠ 开后）21 点，5♠ + 4♡',{d:'==原笔记标注：why？=='}),
        N('2NT','22–23，非逼叫'),
        N('3♣ / 3♢','4 张高花 + 5 张低花，逼局'),
        N('跳原花色','定将牌，邀请'),
        N('3NT / 4M','想打，无满贯兴趣')
      ]}),
      N('2♣','「好牌无配合」，6–7，逼叫',{d:'无 3 张↑红心、无 4 张↑黑桃（1♠ 开叫时另否认 5 张↑红心）', c:[
        N('2♢','低限，约定叫',{d:'要求应叫人示 2 张支持或另一高花'}),
        N('2♡','（1♠ 之后）低限，自然，5♠ + 4♡'),
        N('再叫原花色','6 张↑，非逼叫'),
        N('2♠','（1♡ 之后）逆叫，21+，逼叫'),
        N('2NT','逼局，等待叫'),
        N('3♣ / 3♢','4 张↑红心 + 6 张↑低花，逼局',{d:'==原文写 hearts，疑为泛指 4 张高花=='}),
        N('3M','跳原，定将牌')
      ]}),
      N('2♢','3 张支持，5–7，逼叫',{d:'1♠ 开叫时可能有 5 张红心', c:[
        N('再叫原花色','止叫，通常 4 张'),
        N('3M','邀请，5 张↑'),
        N('另一高花','自然，4 张↑'),
        N('2NT','人为，逼局'),
        N('3♣ / 3♢','4 张高花 + 6 张↑低花，逼局'),
        N('3NT','止叫')
      ]}),
      N('2♡','（1♠ 之后）6–7，5 张↑红心，否认 3 张↑黑桃'),
      N('2M','单加叫：4–5 张将牌，0–4，不逼叫',{d:'后续沿用常规 1M-2M 加叫结构'}),
      N('2NT','mini-splinter：4 张将牌，5–7，非平均',{d:'对同伴而言已是相当好的 1♢', c:[
        N('3M / 4M','止叫'),
        N('3♣','问单缺，逼局')
      ]}),
      N('跳新花','4–6，6 张↑好套，大牌点全在该套，不逼叫'),
      N('3M','跳加叫：4 张将牌，平均，5–7，邀请'),

/* ───────────────────────── 标签 ─────────────────────────
   so 止叫 · nf 不逼叫 · inv 邀请 · f 逼叫 · gf 逼局 · slam 满贯试探
   只在最早出现的叫品上显示：祖先已逼局 → 后续不再标逼局/逼叫；祖先已满贯试探 → 后续不再重复 */
var TAGS = { so:'止叫', nf:'不逼叫', inv:'邀请', f:'逼叫', gf:'逼局', slam:'满贯试探' };
var TAG_ORDER = ['so','nf','inv','f','gf','slam'];
var EXACT = { '逼局':'gf','非逼叫':'nf','不逼叫':'nf','逼叫':'f','逼叫一轮':'f','强迫':'f','强迫叫':'f','邀请':'inv','邀局':'inv','止叫':'so','满贯尝试':'slam','满贯兴趣':'slam' };

function autoTag(n){
  if(n.t){ n.t = TAG_ORDER.filter(function(k){ return n.t.indexOf(k) > -1; }); return; }
  var t = {}, m = n.m;
  /* 按「，；」切分，去掉纯状态词片段，保留原有分隔符 */
  var parts = m.split(/([，；])/), out = '', pendingSep = '';
  for(var i=0;i<parts.length;i+=2){
    var seg = parts[i], k = seg.trim(), sep = parts[i+1] || '';
    if(EXACT[k]){ t[EXACT[k]] = 1; }
    else if(k){ out += (out ? pendingSep : '') + seg; }
    if(sep && k && !EXACT[k]) pendingSep = sep;
  }
  var probe = m.replace(/无满贯兴趣/g,'');
  if(/逼局/.test(m)) t.gf = 1;
  if(/(非|不)逼叫/.test(m)) t.nf = 1;
  if(/逼叫/.test(m.replace(/(非|不)逼叫/g,''))) t.f = 1;
  if(/邀请|邀局/.test(m)) t.inv = 1;
  if(/止叫|想打/.test(m)) t.so = 1;
  if(/满贯(尝试|兴趣)/.test(probe)) t.slam = 1;
  if(t.inv) delete t.nf;
  if(t.gf) delete t.f;
  n.t = TAG_ORDER.filter(function(k){ return t[k]; });
  n.m = out;
}
(function walk(list){ list.forEach(function(n){ autoTag(n); walk(n.c); }); })(ROOTS);

function tagSet(p){
  var s = {};
  for(var i=0;i<p.length;i++){ nodeAt(p.slice(0,i+1)).t.forEach(function(k){ s[k] = 1; }); }
  return s;
}
function eff(n, anc){
  return n.t.filter(function(k){
    if((k === 'gf' || k === 'slam') && anc[k]) return false;
    if(k === 'f' && anc.gf) return false;
    return true;
  });
}
function tagsHtml(list){ return list.map(function(k){ return '<span class="tag t-'+k+'">'+TAGS[k]+'</span>'; }).join(''); }
function dotsHtml(list){
  if(!list.length) return '';
  return '<span class="dots">'+list.map(function(k){ return '<i class="dot t-'+k+'" title="'+TAGS[k]+'"></i>'; }).join('')+'</span>';
}
function legendHtml(foot){
  return '<div class="legend'+(foot?' foot':'')+'">'+TAG_ORDER.map(function(k){ return '<span class="tag t-'+k+'">'+TAGS[k]+'</span>'; }).join('')+
         '<span class="lg-note">标签只标在最早出现的叫品上；进入逼局后，后续叫品不再重复标注</span></div>';
}

/* ───────────────────────── 渲染 ───────────────────────── */
var path = [], prevDepth = 0;
var $rails = document.getElementById('rails');
var $main  = document.getElementById('main');
var $crumbs= document.getElementById('crumbs');
var mobile = window.matchMedia('(max-width:760px)');

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmt(s){
  if(!s) return '';
  s = esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/==(.+?)==/g,'<mark>$1</mark>')
    .replace(/\n/g,'<br>');
  return s.replace(/([\u2661\u2662\u2665\u2666])/g,'<span class="r">$1</span>');
}
function plain(s){ return String(s).replace(/\*\*|==/g,''); }
function listAt(depth, p){ return depth === 0 ? ROOTS : nodeAt(p.slice(0, depth)).c; }
function nodeAt(p){
  var n = null, list = ROOTS;
  for(var i=0;i<p.length;i++){ n = list[p[i]]; if(!n) return null; list = n.c; }
  return n;
}
function labelFor(parent, depth){ return (parent && parent.next) || LABELS[depth] || '后续'; }

function render(){
  var depth = path.length;

  /* 顶栏叫序 */
  var ch = '';
  for(var i=0;i<depth;i++){
    var n = nodeAt(path.slice(0,i+1));
    if(i) ch += '<span class="sep">›</span>';
    ch += '<button type="button" data-up="'+(i+1)+'">'+fmt(n.b)+'</button>';
  }
  $crumbs.innerHTML = ch;

  /* 左侧堆叠栏 */
  var rh = '';
  for(var r=0;r<depth;r++){
    var parent = r ? nodeAt(path.slice(0,r)) : null;
    var list = listAt(r, path);
    var railAnc = tagSet(path.slice(0, r));
    var narrow = (depth - r) > 3;
    var enter = (r === depth-1 && depth > prevDepth);
    rh += '<nav class="rail'+(narrow?' narrow':'')+(enter?' enter':'')+'"><div class="rh">'+esc(r ? labelFor(parent, r) : '开叫 / 防守')+'</div>';
    var lastG = null;
    for(var j=0;j<list.length;j++){
      var it = list[j], has = it.c.length > 0;
      if(r === 0 && it.g !== lastG){ rh += '<div class="rg">'+esc(it.g)+'</div>'; lastG = it.g; }
      rh += '<button type="button" class="ri'+(j===path[r]?' sel':'')+(has?'':' leaf')+'" '+(has?'':'disabled ')+
            'data-r="'+r+'" data-j="'+j+'" title="'+esc(plain(it.b+'：'+it.m))+'">'+
            '<span class="b">'+fmt(it.b)+dotsHtml(eff(it, railAnc))+'</span><span class="m">'+fmt(it.m)+'</span></button>';
    }
    rh += '</nav>';
  }
  $rails.innerHTML = rh;

  /* 主体 */
  var h = '';
  if(depth === 0){
    h += '<h1>SMP 叫牌导航</h1>';
    h += '<p class="intro">选择一个开叫，逐级查看应叫与再叫。已选的层级会收到左侧（手机上堆叠在顶部），点击任一层可随时切换或返回。</p>';
    h += legendHtml(false);
    var groups = [];
    ROOTS.forEach(function(n,idx){
      var g = groups[groups.length-1];
      if(!g || g.name !== n.g){ g = {name:n.g, items:[]}; groups.push(g); }
      g.items.push({n:n, idx:idx});
    });
    groups.forEach(function(g){
      h += '<div class="grp">'+esc(g.name)+'</div><div class="grid">';
      g.items.forEach(function(o){
        var n = o.n, has = n.c.length > 0;
        if(has){
          h += '<button type="button" class="card" data-go="'+o.idx+'"><span class="b">'+fmt(n.b)+'</span>'+
               '<span class="m">'+tagsHtml(n.t)+fmt(n.m)+'</span><span class="c">'+n.c.length+' 项 ›</span></button>';
        }else{
          h += '<div class="card leafcard"><span class="b">'+fmt(n.b)+'</span><span class="m">'+tagsHtml(n.t)+fmt(n.m)+'</span>'+
               (n.d?'<span class="c">'+fmt(n.d)+'</span>':'')+'</div>';
        }
      });
      h += '</div>';
    });
  }else{
    var cur = nodeAt(path);
    var trail = [];
    for(var k=0;k<depth;k++) trail.push(fmt(nodeAt(path.slice(0,k+1)).b));
    h += '<p class="where">'+trail.join('　–　')+'</p>';
    h += '<h1>'+fmt(cur.b)+'</h1>';
    var headTags = tagsHtml(eff(cur, tagSet(path.slice(0, -1))));
    if(cur.m || headTags) h += '<p class="lead">'+headTags+fmt(cur.m)+'</p>';
    if(cur.d) h += '<div class="note">'+fmt(cur.d)+'</div>';
    if(cur.c.length){
      h += '<div class="sect">'+esc(labelFor(cur, depth))+'<span>'+cur.c.length+' 项</span></div><div class="list">';
      var anc = tagSet(path);
      cur.c.forEach(function(n, idx){
        var has = n.c.length > 0;
        var inner = '<div class="rb">'+fmt(n.b)+'</div><div class="rm"><div class="m">'+tagsHtml(eff(n, anc))+fmt(n.m)+'</div>'+
                    (n.d?'<div class="d">'+fmt(n.d)+'</div>':'')+'</div>';
        if(has) h += '<button type="button" class="row" data-go="'+idx+'">'+inner+'<div class="chev">'+n.c.length+' 项 ›</div></button>';
        else    h += '<div class="row">'+inner+'<div class="chev"></div></div>';
      });
      h += '</div>';
    }
  }
  if(depth) h += legendHtml(true);
  $main.innerHTML = '<div class="fade">'+h+'</div>';
  $main.scrollTop = 0;
  if(mobile.matches) document.getElementById('layout').scrollTop = 0;

  /* 让每栏的选中项可见 */
  [].forEach.call($rails.querySelectorAll('.ri.sel'), function(el){
    el.scrollIntoView({block:'nearest', inline:'center'});
  });
  $crumbs.scrollLeft = $crumbs.scrollWidth;
  prevDepth = depth;
  document.body.classList.toggle('depth0', depth === 0);
}

/* ───────────────────────── 状态与交互 ───────────────────────── */
function setPath(p, replace){
  path = p;
  var hash = p.length ? '#p=' + p.join('.') : '#';
  if(replace) history.replaceState(null, '', hash);
  else if(location.hash !== hash) history.pushState(null, '', hash);
  render();
}
function readHash(){
  var m = location.hash.match(/^#p=([\d.]+)$/);
  if(!m) return [];
  var p = m[1].split('.').map(Number), ok = [];
  for(var i=0;i<p.length;i++){
    var n = nodeAt(ok.concat(p[i]));
    if(!n || !n.c.length) break;
    ok.push(p[i]);
  }
  return ok;
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-go],[data-r],[data-up],#home');
  if(!t) return;
  if(t.id === 'home'){ setPath([]); return; }
  if(t.hasAttribute('data-up')){ setPath(path.slice(0, +t.getAttribute('data-up'))); return; }
  if(t.hasAttribute('data-r')){
    var r = +t.getAttribute('data-r'), j = +t.getAttribute('data-j');
    if(path[r] === j && path.length === r+1) return;
    setPath(path.slice(0, r).concat(j)); return;
  }
  if(t.hasAttribute('data-go')){ setPath(path.concat(+t.getAttribute('data-go'))); }
});
document.addEventListener('keydown', function(e){
  if((e.key === 'Escape' || e.key === 'ArrowLeft') && path.length && !e.target.closest('input,textarea')){
    e.preventDefault(); setPath(path.slice(0, -1));
  }
});
window.addEventListener('popstate', function(){ path = readHash(); render(); });

/* 侧栏含义显示开关（记住在本机） */
var DESC_KEY = 'smp-nav-rail-desc';
var $eye = document.getElementById('eye');
function applyDesc(on){
  document.body.classList.toggle('desc-off', !on);
  $eye.setAttribute('aria-pressed', on ? 'true' : 'false');
  $eye.title = on ? '左侧栏：显示含义（点击隐藏）' : '左侧栏：只显示叫品（点击显示含义）';
}
var descOn = true;
try{ var v = localStorage.getItem(DESC_KEY); if(v === '0') descOn = false; }catch(e){}
applyDesc(descOn);
$eye.addEventListener('click', function(){
  descOn = !descOn; applyDesc(descOn);
  try{ localStorage.setItem(DESC_KEY, descOn ? '1' : '0'); }catch(e){}
});

path = readHash();
render();
</script>
